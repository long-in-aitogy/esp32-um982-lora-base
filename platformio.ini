; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_unflags = -std=gnu++11 -std=c++11 -std=c++14
build_flags = -std=gnu++17

[env:tdm240x_dev_general]
platform = espressif32
board = esp32dev
framework = arduino
lib_ignore = 
	mockPubSubClient
	mockWiFi
lib_deps = 
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0
	vshymanskyy/StreamDebugger@^1.0.1
monitor_speed = 115200
build_flags = -std=gnu++17
		-DBOARD_TDM_240X -DRTCM_COMMUNICATION_PROTOCOL=0

[env:tdm240x_dev_general_debug]
platform = espressif32
board = esp32dev
framework = arduino
lib_ignore = 
	mockPubSubClient
	mockWiFi
lib_deps = 
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0
	vshymanskyy/StreamDebugger@^1.0.1
monitor_speed = 115200
build_flags = -std=gnu++17
		-DBOARD_TDM_240X -DRTCM_COMMUNICATION_PROTOCOL=0 -DPROGRAM_DEBUG -DDUMP_AT_COMMANDS

[env:tdm240x_dev_general_test]
platform = espressif32
board = esp32dev
framework = arduino
lib_ignore = 
	mockPubSubClient
	mockWiFi
lib_deps = 
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0
	vshymanskyy/StreamDebugger@^1.0.1
monitor_speed = 115200
build_flags = -std=gnu++17 -DBOARD_TDM_240X
		-DRTCM_COMMUNICATION_PROTOCOL=0 -DPROGRAM_DEBUG -DPROGRAM_TEST -DDUMP_AT_COMMANDS

[env:tdm240x_dev_unit_test]
platform = espressif32
board = esp32dev
framework = arduino
lib_ignore = 
	mockPubSubClient
	mockWiFi
lib_deps = 
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0
	vshymanskyy/StreamDebugger@^1.0.1
test_build_src = true
test_framework = unity
test_filter =
	test_sim
monitor_speed = 115200
build_flags = -std=gnu++17 -DBOARD_TDM_240X
		-DRTCM_COMMUNICATION_PROTOCOL=0 -DPROGRAM_DEBUG -DPROGRAM_TEST -DDUMP_AT_COMMANDS
